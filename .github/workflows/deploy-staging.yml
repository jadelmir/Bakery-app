name: Deploy Supabase to Staging

on:
  push:
    branches:
      - develop
    paths:
      - "Front-end/supabase/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy Supabase to Staging Environment
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        working-directory: Front-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase CLI to Staging Project
        run: supabase link --project-ref ${{ secrets.STAGING_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Capture migration history before deployment
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Apply Database Migrations
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Capture migration history after deployment
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Verify required staging tables
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --linked --schema public --file /tmp/staging-schema.sql
          required_tables=(profiles bakeries bakery_memberships customers orders order_items recipes)
          for table in "${required_tables[@]}"; do
            if ! grep -Eiq "CREATE TABLE.*${table}" /tmp/staging-schema.sql; then
              echo "Missing required staging table: public.${table}" >&2
              exit 1
            fi
          done
          echo "Verified required staging tables: ${required_tables[*]}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure hosted invitation callback
        run: supabase secrets set APP_URL=https://jadelmir.github.io/Bakery-app/
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
