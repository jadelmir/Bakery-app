name: Deploy Development Frontend to GitHub Pages

on:
  push:
    branches:
      - develop
    paths:
      - "Front-end/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: development-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages frontend
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: Front-end/pnpm-lock.yaml

      - name: Enable pnpm 11.9.0
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install frontend dependencies
        working-directory: Front-end
        run: pnpm install --frozen-lockfile

      - name: Build development frontend
        working-directory: Front-end
        run: pnpm run build
        env:
          VITE_DEPLOY_BASE_PATH: /Bakery-app/
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify bundle budget
        working-directory: Front-end
        run: pnpm run check:bundle

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Front-end/dist

  deploy:
    name: Publish development frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed root and SPA route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 "$PAGE_URL"
          curl --fail --location --retry 5 --retry-delay 3 "${PAGE_URL%/}/orders" >/dev/null
          echo "Deployed $GITHUB_SHA to $PAGE_URL"
