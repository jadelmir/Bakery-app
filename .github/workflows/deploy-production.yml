name: Deploy Supabase to Production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy Supabase to Production Environment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase CLI to Production Project
        run: supabase link --project-ref ${{ secrets.PRODUCTION_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

      - name: Execute Pre-Release Production Database Backup
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          BACKUP_FILE="backups/prod_backup_${TIMESTAMP}.sql"
          supabase db dump --linked -f "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

      - name: Archive Production Database Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-production-db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Apply Database Migrations (Forward-Fix Only)
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
