name: CI Quality Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: Front-end
        run: npm install

      - name: TypeScript typecheck
        working-directory: Front-end
        run: npm run typecheck

      - name: Code linting
        working-directory: Front-end
        run: npm run lint

      - name: Run unit tests
        working-directory: Front-end
        run: npm test

      - name: Build frontend application
        working-directory: Front-end
        run: npm run build
        env:
          VITE_USE_MOCK_BACKEND: "true"

      - name: Verify bundle budget
        working-directory: Front-end
        run: npm run check:bundle

      - name: Install Playwright Chromium
        working-directory: Front-end
        run: npx playwright install --with-deps chromium

      - name: Run desktop E2E smoke suite
        working-directory: Front-end
        run: npx playwright test --project=desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Front-end/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: Supabase Database Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset local database & verify migrations
        run: supabase db reset

      - name: Lint database schema
        run: supabase db lint

      - name: Stop Supabase stack
        if: always()
        run: supabase stop
