<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bakery App UI/UX Design</title>
    <meta name="description" content="Streamlines bakery production by managing orders, tasks, recipes, inventory, and finances to boost efficiency and profitability for home bakers." />
    <meta name="robots" content="noindex, nofollow" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("gh-pages-spa-redirect");
        if (!redirect) return;
        sessionStorage.removeItem("gh-pages-spa-redirect");
        var base = "/Bakery-app";
        var normalized = redirect.startsWith("/") ? redirect : "/" + redirect;
        window.history.replaceState(null, "", base + normalized);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="app-version"
      aria-label="Application version"
      style="position:fixed;top:8px;right:10px;z-index:9999;padding:3px 8px;border:1px solid rgba(229,221,211,.95);border-radius:999px;background:rgba(255,255,255,.92);color:#988D84;font:700 10px/1 system-ui,sans-serif;letter-spacing:.02em;pointer-events:none;box-shadow:0 1px 6px rgba(47,41,37,.06)"
    >
      v%VITE_APP_VERSION%
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
